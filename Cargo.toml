[package]
name = "grove"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal dashboard of your git worktrees: which ones a Claude Code, Codex or OpenCode session is using, how much disk each takes, and removal with the right git command"
license = "MIT"
repository = "https://github.com/victorlcampos/grove"
readme = "README.md"
keywords = ["git", "worktree", "tui", "claude", "disk-usage"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
rayon = "1.12"
serde_json = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
